<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter For You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ff4f9150, transparent 30%),
        radial-gradient(circle at 80% 80%, #8b5cf650, transparent 30%),
        linear-gradient(135deg, #09000d, #22001f, #08000d);

    color: white;

    transition: 1s ease;
}


/* =========================================
   FLOATING HEARTS
========================================= */

.floating-heart {
    position: fixed;

    bottom: -50px;

    font-size: 20px;

    opacity: 0;

    pointer-events: none;

    animation: floatHeart linear infinite;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);
        opacity: 0;
    }
}


/* =========================================
   INTRO
========================================= */

.intro {

    position: relative;

    z-index: 10;

    text-align: center;

    transition: .8s ease;
}

.intro.hide {

    opacity: 0;

    transform:
        scale(.85)
        translateY(-30px);

    pointer-events: none;
}

.small-title {

    font-size: 14px;

    letter-spacing: 5px;

    color: #f9a8d4;

    margin-bottom: 18px;
}

.intro h1 {

    font-size:
        clamp(35px, 7vw, 65px);

    margin-bottom: 40px;

    background:
        linear-gradient(
            90deg,
            #f472b6,
            #f9a8d4,
            #c084fc
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


/* =========================================
   ENVELOPE WRAPPER
========================================= */

.envelope-wrapper {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;
}


/* =========================================
   FULL ENVELOPE
========================================= */

.envelope {

    position: relative;

    width: 380px;

    height: 245px;

    cursor: pointer;

    border-radius: 8px;

    background: #c94379;

    box-shadow:
        0 30px 80px rgba(0,0,0,.6);

    perspective: 1000px;

    transition:
        .5s ease;

    overflow: visible;
}


.envelope:hover {

    transform:
        translateY(-8px)
        scale(1.025);

    box-shadow:
        0 40px 100px
        rgba(236,72,153,.4);
}


/* =========================================
   LETTER INSIDE
========================================= */

.inside-paper {

    position: absolute;

    left: 22px;

    right: 22px;

    bottom: 15px;

    height: 205px;

    background:
        repeating-linear-gradient(
            to bottom,
            #fffdf7 0px,
            #fffdf7 30px,
            #eadfe1 31px
        );

    border-radius: 4px;

    color: #7d2952;

    padding: 25px;

    z-index: 2;

    transform:
        translateY(0);

    transition:
        1s cubic-bezier(.2,.8,.2,1);

    box-shadow:
        0 5px 15px rgba(0,0,0,.15);
}


.inside-paper span {

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: 22px;
}


/* =========================================
   FRONT ENVELOPE PANEL
========================================= */

.envelope-front {

    position: absolute;

    inset: 0;

    background: #c9477b;

    border-radius: 8px;

    z-index: 4;

    overflow: hidden;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.12);
}


/* =========================================
   LEFT FOLD
========================================= */

.envelope-front::before {

    content: "";

    position: absolute;

    left: 0;

    bottom: 0;

    width: 0;

    height: 0;

    border-top:
        122px solid transparent;

    border-left:
        190px solid #b33869;

    z-index: 3;
}


/* =========================================
   RIGHT FOLD
========================================= */

.envelope-front::after {

    content: "";

    position: absolute;

    right: 0;

    bottom: 0;

    width: 0;

    height: 0;

    border-top:
        122px solid transparent;

    border-right:
        190px solid #b33869;

    z-index: 3;
}


/* =========================================
   BOTTOM FOLD
========================================= */

.bottom-fold {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 0;

    height: 0;

    border-left:
        190px solid transparent;

    border-right:
        190px solid transparent;

    border-bottom:
        135px solid #a82f60;

    z-index: 5;
}


/* =========================================
   TOP FLAP
========================================= */

.flap {

    position: absolute;

    left: 0;

    top: 0;

    width: 0;

    height: 0;

    border-left:
        190px solid transparent;

    border-right:
        190px solid transparent;

    border-top:
        135px solid #ee71a5;

    transform-origin: top center;

    transition:
        1s cubic-bezier(.2,.8,.2,1);

    z-index: 8;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.12)
        );
}


/* =========================================
   SEAL
========================================= */

.seal {

    position: absolute;

    left: 50%;

    top: 54%;

    transform:
        translate(-50%, -50%);

    width: 65px;

    height: 65px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #9e164f,
            #7b1240
        );

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 28px;

    z-index: 12;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.4);

    transition:
        .6s ease;
}


/* =========================================
   OPEN ENVELOPE
========================================= */

.envelope.open .flap {

    transform:
        rotateX(180deg);

    z-index: 1;
}


.envelope.open .inside-paper {

    transform:
        translateY(-145px);

    z-index: 7;
}


.envelope.open .seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);
}


/* =========================================
   CLICK TEXT
========================================= */

.click-text {

    margin-top: 45px;

    color: #ddd;

    font-size: 15px;

    letter-spacing: 1px;

    animation:
        softPulse 2s infinite;
}

@keyframes softPulse {

    0%,100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================
   LETTER SCENE
========================================= */

.letter-scene {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1s ease;
}


.letter-scene.show {

    opacity: 1;

    pointer-events: auto;
}


/* =========================================
   PAPER
========================================= */

.letter-paper {

    position: relative;

    width:
        min(680px, 92vw);

    height:
        min(78vh, 720px);

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        70px 65px 90px;

    color: #3e2632;

    border-radius: 3px;

    background:
        repeating-linear-gradient(
            to bottom,
            #fffdf5 0px,
            #fffdf5 31px,
            #e9d9dd 32px
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.75);

    transform:
        translateY(100px)
        scale(.75)
        rotate(-2deg);

    transition:
        1s cubic-bezier(.2,.8,.2,1);

    scrollbar-width: thin;
}


.letter-scene.show .letter-paper {

    transform:
        translateY(0)
        scale(1)
        rotate(0deg);
}


/* Paper border */

.letter-paper::before {

    content: "";

    position: absolute;

    inset: 12px;

    border:
        1px solid
        rgba(180,100,130,.22);

    pointer-events: none;
}


/* =========================================
   HANDWRITING
========================================= */

.letter-heading {

    text-align: center;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: 36px;

    color: #9b285d;

    margin-bottom: 35px;
}


.writing-area {

    position: relative;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:
        clamp(18px, 2.5vw, 22px);

    line-height: 2;

    letter-spacing: .3px;

    white-space: normal;
}


/* Animated pen */

.pen {

    display: inline-block;

    font-size: 25px;

    margin-left: 5px;

    transform:
        rotate(-25deg);

    animation:
        penWriting .45s infinite alternate;
}


@keyframes penWriting {

    from {

        transform:
            rotate(-25deg)
            translateY(0);
    }

    to {

        transform:
            rotate(-25deg)
            translateY(-3px);
    }
}


/* =========================================
   SIGNATURE
========================================= */

.signature {

    margin-top: 45px;

    text-align: right;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: 25px;

    color: #9b285d;

    opacity: 0;

    transform:
        translateY(15px);

    transition:
        1s ease;
}


.signature.show {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================
   NEXT BUTTON
========================================= */

.next-btn {

    display: block;

    margin:
        40px auto 0;

    padding:
        15px 34px;

    border: none;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #c026d3
        );

    color: white;

    font-family: Arial, sans-serif;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        .7s ease;

    box-shadow:
        0 10px 30px
        rgba(236,72,153,.4);
}


.next-btn.show {

    opacity: 1;

    transform:
        translateY(0);
}


.next-btn:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 15px 40px
        rgba(236,72,153,.6);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    .envelope {

        width: 300px;

        height: 195px;
    }

    .flap {

        border-left-width: 150px;

        border-right-width: 150px;

        border-top-width: 110px;
    }

    .envelope-front::before {

        border-left-width: 150px;

        border-top-width: 98px;
    }

    .envelope-front::after {

        border-right-width: 150px;

        border-top-width: 98px;
    }

    .bottom-fold {

        border-left-width: 150px;

        border-right-width: 150px;

        border-bottom-width: 110px;
    }

    .inside-paper {

        left: 16px;

        right: 16px;

        height: 160px;
    }

    .letter-paper {

        height: 82vh;

        padding:
            55px 28px 70px;
    }

    .letter-heading {

        font-size: 29px;
    }

    .writing-area {

        font-size: 17px;

        line-height: 2;
    }

    .signature {

        font-size: 21px;
    }
}

</style>

</head>


<body>


<!-- FLOATING HEARTS -->

<div class="floating-heart"
     style="left:8%;animation-duration:9s;">
    ❤️
</div>

<div class="floating-heart"
     style="left:25%;animation-duration:12s;animation-delay:2s;">
    💕
</div>

<div class="floating-heart"
     style="left:48%;animation-duration:10s;animation-delay:4s;">
    💗
</div>

<div class="floating-heart"
     style="left:72%;animation-duration:13s;animation-delay:1s;">
    💖
</div>

<div class="floating-heart"
     style="left:90%;animation-duration:11s;animation-delay:3s;">
    💘
</div>


<!-- =========================================
     ENVELOPE INTRO
========================================= -->

<div class="intro" id="intro">

    <div class="small-title">
        SOMETHING I WANTED TO TELL YOU
    </div>

    <h1>
        A Letter For You ❤️
    </h1>


    <div class="envelope-wrapper">


        <div class="envelope"
             id="envelope"
             onclick="openLetter()">


            <!-- Letter inside -->

            <div class="inside-paper">

                <span>
                    For You ❤️
                </span>

            </div>


            <!-- Full front -->

            <div class="envelope-front">

                <!-- Bottom fold -->

                <div class="bottom-fold"></div>

            </div>


            <!-- Top flap -->

            <div class="flap"></div>


            <!-- Seal -->

            <div class="seal">
                ❤️
            </div>


        </div>


        <div class="click-text"
             id="clickText">

            Click the letter to open it 💌

        </div>

    </div>

</div>


<!-- =========================================
     LETTER
========================================= -->

<div class="letter-scene"
     id="letterScene">


    <div class="letter-paper"
         id="letterPaper">


        <div class="letter-heading">

            My Dear ❤️

        </div>


        <div class="writing-area"
             id="writingArea">

        </div>


        <div class="signature"
             id="signature">

            With lots of love ❤️

        </div>


        <button
            class="next-btn"
            id="nextButton"
            onclick="goToCake()">

            One More Surprise ✨

        </button>


    </div>

</div>


<script>


/* =========================================
   LETTER MESSAGE
========================================= */

const letterText = `I don't know if words will ever be enough to explain how special you are to me.

But I still wanted to try. ❤️

You have become one of those beautiful parts of my life that I never want to take for granted.

Your smile, your little talks, your silly moments, even the times when you annoy me... somehow, I love all of it. ❤️

I hope this little surprise makes you smile today.

And I hope you always remember one thing...

You are really, really special to me. ❤️`;


let index = 0;

let typingStarted = false;


/* =========================================
   OPEN ENVELOPE
========================================= */

function openLetter() {

    if (typingStarted) {
        return;
    }

    typingStarted = true;


    const envelope =
        document.getElementById(
            "envelope"
        );


    const intro =
        document.getElementById(
            "intro"
        );


    const clickText =
        document.getElementById(
            "clickText"
        );


    envelope.classList.add(
        "open"
    );


    clickText.innerHTML =
        "Opening something special... ❤️";


    setTimeout(function() {

        intro.classList.add(
            "hide"
        );

    }, 700);


    setTimeout(function() {

        document.getElementById(
            "letterScene"
        ).classList.add(
            "show"
        );


        setTimeout(
            startTyping,
            900
        );

    }, 1300);

}


/* =========================================
   TYPEWRITER
========================================= */

function startTyping() {

    const writingArea =
        document.getElementById(
            "writingArea"
        );


    writingArea.innerHTML =
        '<span class="pen">🖊️</span>';


    typeWriter();

}


function typeWriter() {

    const writingArea =
        document.getElementById(
            "writingArea"
        );


    if (
        index <
        letterText.length
    ) {

        const character =
            letterText.charAt(index);


        /* New paragraph */

        if (
            character === "\n"
        ) {

            writingArea.innerHTML =
                writingArea.innerHTML
                .replace(
                    '<span class="pen">🖊️</span>',
                    '<br><br><span class="pen">🖊️</span>'
                );

        }

        else {

            const pen =
                writingArea.querySelector(
                    ".pen"
                );


            if (pen) {
                pen.remove();
            }


            writingArea.innerHTML +=
                character;


            writingArea.innerHTML +=
                '<span class="pen">🖊️</span>';

        }


        index++;


        /* AUTO SCROLL */

        const paper =
            document.getElementById(
                "letterPaper"
            );


        paper.scrollTo({

            top:
                paper.scrollHeight,

            behavior:
                "smooth"

        });


        /* Slow handwriting */

        setTimeout(
            typeWriter,
            100
        );

    }

    else {

        const pen =
            writingArea.querySelector(
                ".pen"
            );


        if (pen) {

            pen.style.display =
                "none";

        }


        finishLetter();

    }

}


/* =========================================
   FINISH LETTER
========================================= */

function finishLetter() {

    setTimeout(function() {

        document.getElementById(
            "signature"
        ).classList.add(
            "show"
        );

    }, 500);


    setTimeout(function() {

        document.getElementById(
            "nextButton"
        ).classList.add(
            "show"
        );

    }, 1400);

}


/* =========================================
   GO TO CAKE
========================================= */

function goToCake() {

    document.body.style.opacity =
        "0";

    document.body.style.transform =
        "scale(1.04)";

    document.body.style.transition =
        "1s ease";


    setTimeout(function() {

        window.location.href =
            "/cake/";

    }, 900);

}

</script>

</body>

</html>
