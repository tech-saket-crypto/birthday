<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Before We Begin ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #ff4f9150,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #8b5cf650,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #05000b,
                    #18001f,
                    #08000d
                );

            color: white;

            transition: background 1s ease;

        }


        /* BACKGROUND GLOW */

        .glow {

            position: fixed;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: .25;

            pointer-events: none;

            transition:
                left .5s ease,
                top .5s ease;

        }


        .glow.one {

            background: #ff3d81;

            left: -100px;

            top: -100px;

        }


        .glow.two {

            background: #8b5cf6;

            right: -100px;

            bottom: -100px;

        }


        /* PARTICLES */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

        }


        .particle {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: .15;

            animation: particleFloat linear infinite;

        }


        @keyframes particleFloat {

            0% {

                transform:
                    translateY(0)
                    scale(.5);

                opacity: 0;

            }

            20% {

                opacity: .7;

            }

            50% {

                transform:
                    translateY(-40vh)
                    scale(1);

            }

            100% {

                transform:
                    translateY(-110vh)
                    scale(.3);

                opacity: 0;

            }

        }


        /* MAIN */

        .scene {

            position: relative;

            z-index: 5;

            width: min(90%, 800px);

            text-align: center;

            padding: 30px;

        }


        /* HEART */

        .heart {

            font-size: 70px;

            margin-bottom: 25px;

            animation:
                heartbeat 1.5s infinite;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(255, 80, 150, .7)
                );

            transition: .5s;

        }


        @keyframes heartbeat {

            0%,100% {

                transform: scale(1);

            }

            15% {

                transform: scale(1.25);

            }

            30% {

                transform: scale(1);

            }

            45% {

                transform: scale(1.15);

            }

        }


        /* SMALL HEADING */

        .small-heading {

            font-size: 15px;

            letter-spacing: 6px;

            color: #f9a8d4;

            opacity: 0;

            animation:
                fadeUp 1s forwards;

            animation-delay: .8s;

        }


        /* TITLE */

        h1 {

            margin-top: 20px;

            font-size:
                clamp(40px, 7vw, 75px);

            background:

                linear-gradient(
                    90deg,
                    #f472b6,
                    #f9a8d4,
                    #c084fc,
                    #f472b6
                );

            background-size: 200%;

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                gradientMove 4s infinite linear;

            opacity: 0;

            animation-delay: 1.2s;

            animation-fill-mode: forwards;

        }


        @keyframes gradientMove {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 200%;
            }

        }


        /* MESSAGE */

        .message {

            margin: 35px auto 0;

            max-width: 650px;

            min-height: 150px;

            font-size: 21px;

            line-height: 1.8;

            color: #eeeeee;

        }


        .line {

            opacity: 0;

            transform: translateY(15px);

            transition:
                opacity .8s,
                transform .8s;

        }


        .line.show {

            opacity: 1;

            transform: translateY(0);

        }


        /* READY */

        .ready {

            margin-top: 20px;

            opacity: 0;

            transform: scale(.8);

            transition: 1s;

        }


        .ready.show {

            opacity: 1;

            transform: scale(1);

        }


        .ready-text {

            font-size: 28px;

            margin-bottom: 25px;

            color: #fbcfe8;

        }


        /* BUTTON */

        .ready-btn {

            padding: 16px 38px;

            border: none;

            border-radius: 50px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background:

                linear-gradient(
                    135deg,
                    #ec4899,
                    #c026d3
                );

            box-shadow:

                0 10px 35px
                rgba(236,72,153,.4);

            transition: .3s;

        }


        .ready-btn:hover {

            transform:
                translateY(-5px)
                scale(1.05);

            box-shadow:

                0 15px 50px
                rgba(236,72,153,.7);

        }


        /* SURPRISE */

        .surprise {

            position: fixed;

            inset: 0;

            z-index: 20;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:

                radial-gradient(
                    circle,
                    #3b073f,
                    #08000d
                );

            opacity: 0;

            pointer-events: none;

            transition: 1s;

        }


        .surprise.show {

            opacity: 1;

            pointer-events: auto;

        }


        .surprise-content {

            transform: scale(.5);

            transition: 1s;

        }


        .surprise.show
        .surprise-content {

            transform: scale(1);

        }


        .surprise-heart {

            font-size: 90px;

            animation:
                bigHeartbeat 1s infinite;

        }


        @keyframes bigHeartbeat {

            0%,100% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.35);

            }

        }


        .surprise h2 {

            margin-top: 25px;

            font-size:
                clamp(30px, 6vw, 55px);

            color: #f9a8d4;

        }


        .surprise p {

            margin-top: 15px;

            font-size: 20px;

            color: #ddd;

        }


        /* EXPLOSION HEARTS */

        .explosion-heart {

            position: fixed;

            left: 50%;

            top: 50%;

            z-index: 50;

            font-size: 25px;

            pointer-events: none;

            animation:
                explode 1.5s forwards;

        }


        @keyframes explode {

            from {

                transform:
                    translate(-50%,-50%)
                    scale(.5);

                opacity: 1;

            }

            to {

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    rotate(360deg)
                    scale(1.4);

                opacity: 0;

            }

        }


        /* FADE OUT */

        .fade-out {

            animation:
                fadeScreen 1.5s forwards;

        }


        @keyframes fadeScreen {

            to {

                opacity: 0;

                transform: scale(1.1);

            }

        }


        @keyframes fadeUp {

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* MOBILE */

        @media(max-width:600px) {

            .scene {

                padding: 20px;

            }

            .heart {

                font-size: 55px;

            }

            .message {

                font-size: 18px;

            }

            .ready-text {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


    <!-- GLOW -->

    <div class="glow one"></div>

    <div class="glow two"></div>


    <!-- PARTICLES -->

    <div class="particles" id="particles"></div>


    <!-- MAIN -->

    <div class="scene" id="scene">


        <div class="heart">

            ❤️

        </div>


        <div class="small-heading">

            BEFORE WE BEGIN

        </div>


        <h1>

            There's Something...

        </h1>


        <div class="message">

            <div
                class="line"
                id="line1">

                I made this little world...

            </div>


            <div
                class="line"
                id="line2">

                just for you. ❤️

            </div>


            <div
                class="line"
                id="line3">

                And there's a reason
                I wanted you to see it.

            </div>

        </div>


        <!-- READY -->

        <div
            class="ready"
            id="ready">


            <div class="ready-text">

                So... Are You Ready? ❤️

            </div>


            <button
                class="ready-btn"
                onclick="startSurprise()">

                YES, I'M READY ✨

            </button>


        </div>


    </div>


    <!-- SURPRISE SCREEN -->

    <div
        class="surprise"
        id="surprise">


        <div class="surprise-content">


            <div class="surprise-heart">

                💓

            </div>


            <h2>

                Dil Thaam Ke Baith Jao...

            </h2>


            <p id="surpriseText">

                Because something beautiful
                is about to begin. ❤️

            </p>


        </div>


    </div>


    <script>


        /* PARTICLES */

        const particles =
            document.getElementById("particles");


        for (let i = 0; i < 45; i++) {

            const particle =
                document.createElement("div");

            particle.className =
                "particle";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.top =
                Math.random() * 100 + "%";

            particle.style.animationDuration =
                (6 + Math.random() * 10) + "s";

            particle.style.animationDelay =
                Math.random() * 8 + "s";

            particles.appendChild(particle);

        }


        /* MOUSE GLOW */

        const glowOne =
            document.querySelector(".glow.one");

        const glowTwo =
            document.querySelector(".glow.two");


        document.addEventListener(
            "mousemove",
            function(e) {

                glowOne.style.left =
                    (e.clientX - 175) + "px";

                glowOne.style.top =
                    (e.clientY - 175) + "px";

            }
        );


        /* MESSAGE SEQUENCE */

        setTimeout(() => {

            document
                .getElementById("line1")
                .classList.add("show");

        }, 2500);


        setTimeout(() => {

            document
                .getElementById("line2")
                .classList.add("show");

        }, 4000);


        setTimeout(() => {

            document
                .getElementById("line3")
                .classList.add("show");

        }, 5600);


        setTimeout(() => {

            document
                .getElementById("ready")
                .classList.add("show");

        }, 7500);


        /* START SURPRISE */

        function startSurprise() {


            const surprise =
                document.getElementById("surprise");


            surprise.classList.add("show");


            /* HEARTBEAT SOUND-LIKE VISUAL */

            document.body.style.animation =
                "none";


            /* WAIT */

            setTimeout(() => {


                document.getElementById(
                    "surpriseText"
                ).innerHTML =

                    "Because this is only the beginning... ❤️";


            }, 2500);


            /* HEART EXPLOSION */

            setTimeout(() => {

                createExplosion();

            }, 4000);


            /* GO TO MEMORIES */

            setTimeout(() => {

                document.body.classList.add(
                    "fade-out"
                );

            }, 5000);


            setTimeout(() => {

                window.location.href =
                    "/memories/";

            }, 6200);

        }


        /* HEART EXPLOSION */

        function createExplosion() {


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "✨",
                "💓"

            ];


            for (let i = 0; i < 35; i++) {


                const heart =
                    document.createElement("div");


                heart.className =
                    "explosion-heart";


                heart.innerText =
                    hearts[
                        Math.floor(
                            Math.random() *
                            hearts.length
                        )
                    ];


                const angle =
                    Math.random() *
                    Math.PI * 2;


                const distance =
                    150 +
                    Math.random() * 350;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                heart.style.setProperty(
                    "--x",
                    x + "px"
                );


                heart.style.setProperty(
                    "--y",
                    y + "px"
                );


                heart.style.animationDelay =
                    Math.random() * .3 + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(() => {

                    heart.remove();

                }, 2000);

            }

        }

    </script>


</body>

</html>
