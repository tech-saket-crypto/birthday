<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(circle at 20% 20%, #ff4f9150, transparent 30%),
        radial-gradient(circle at 80% 80%, #8b5cf650, transparent 30%),
        linear-gradient(135deg, #08000d, #25002e, #09000d);

    transition: 1s ease;
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow {
    position: fixed;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    filter: blur(110px);

    opacity: .25;

    animation:
        glowMove 8s infinite alternate ease-in-out;

    pointer-events: none;
}

.glow.one {
    background: #ff4f91;

    top: -150px;
    left: -120px;
}

.glow.two {
    background: #8b5cf6;

    right: -150px;
    bottom: -150px;

    animation-delay: 2s;
}

@keyframes glowMove {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(80px,60px) scale(1.2);
    }
}


/* =========================
   MAIN
========================= */

.scene {
    position: relative;

    z-index: 5;

    width: 100%;

    text-align: center;

    padding: 15px;

    padding-bottom: 100px;
}

.small-title {

    font-size: 15px;

    letter-spacing: 5px;

    color: #f9a8d4;

    margin-bottom: 12px;

    opacity: 0;

    animation:
        fadeDown 1s ease forwards;
}

h1 {

    font-size:
        clamp(38px, 7vw, 75px);

    margin-bottom: 12px;

    background:
        linear-gradient(
            90deg,
            #ff6fa8,
            #ffd1e3,
            #c084fc
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    opacity: 0;

    animation:
        fadeDown 1s ease .3s forwards;
}

.subtitle {

    font-size: 19px;

    color: #ddd;

    margin-bottom: 25px;

    opacity: 0;

    animation:
        fadeDown 1s ease .6s forwards;
}

@keyframes fadeDown {

    from {
        opacity: 0;
        transform: translateY(-25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   CAKE AREA
========================= */

.cake-area {

    position: relative;

    width: 360px;

    height: 410px;

    margin: auto;
}


/* =========================
   PLATE
========================= */

.plate {

    position: absolute;

    width: 350px;

    height: 28px;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #f8c4da,
            #d86a9d
        );

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.5);
}


/* =========================
   BOTTOM CAKE
========================= */

.cake-bottom {

    position: absolute;

    width: 290px;

    height: 85px;

    bottom: 48px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius:
        18px 18px 12px 12px;

    background:
        linear-gradient(
            to right,
            #9d315e,
            #e65d94,
            #a82d60
        );

    box-shadow:
        inset 0 -12px 0
        rgba(100,0,40,.18);
}


/* =========================
   MIDDLE CAKE
========================= */

.cake-middle {

    position: absolute;

    width: 250px;

    height: 75px;

    bottom: 125px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius:
        18px 18px 10px 10px;

    background:
        linear-gradient(
            to right,
            #b63d70,
            #f07cad,
            #b6386d
        );
}


/* =========================
   TOP CAKE
========================= */

.cake-top {

    position: absolute;

    width: 210px;

    height: 70px;

    bottom: 200px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius:
        18px 18px 12px 12px;

    background:
        linear-gradient(
            to right,
            #d24b80,
            #ff9fc3,
            #d84f87
        );

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25);
}


/* =========================
   FROSTING
========================= */

.frosting {

    position: absolute;

    top: -7px;

    left: 0;

    width: 100%;

    height: 25px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffd8e8
        );

    box-shadow:
        0 4px 5px
        rgba(0,0,0,.12);
}

.drip {

    position: absolute;

    width: 18px;

    height: 28px;

    background: #fff;

    border-radius:
        0 0 12px 12px;

    top: 7px;
}

.drip.one {
    left: 28px;
}

.drip.two {
    left: 85px;
}

.drip.three {
    right: 55px;
}

.drip.four {
    right: 20px;
}


/* =========================
   CANDLES
========================= */

.candles {

    position: absolute;

    bottom: 265px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 32px;

    z-index: 20;
}

.candle {

    position: relative;

    width: 18px;

    height: 58px;

    border-radius: 5px;

    background:
        repeating-linear-gradient(
            135deg,
            #fff,
            #fff 7px,
            #f472b6 7px,
            #f472b6 13px
        );

    box-shadow:
        0 4px 8px
        rgba(0,0,0,.25);
}

.candle.middle {
    height: 68px;
}


/* WICK */

.wick {

    position: absolute;

    top: -9px;

    left: 50%;

    width: 3px;

    height: 10px;

    transform:
        translateX(-50%);

    background: #222;

    border-radius: 3px;
}


/* =========================
   FLAME
========================= */

.flame {

    position: absolute;

    top: -45px;

    left: 50%;

    width: 20px;

    height: 31px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border-radius:
        50% 50% 50% 0;

    background:
        linear-gradient(
            135deg,
            #fff7a8,
            #ffb300,
            #ff4f00
        );

    box-shadow:
        0 0 15px #ffb300,
        0 0 35px #ff7b00;

    opacity: 0;

    transition: .5s ease;

    transform-origin:
        bottom center;
}

.flame.lit {

    opacity: 1;

    animation:
        flicker .16s infinite alternate;
}

@keyframes flicker {

    from {
        transform:
            translateX(-50%)
            rotate(43deg)
            scale(.95);
    }

    to {
        transform:
            translateX(-50%)
            rotate(48deg)
            scale(1.08);
    }
}


/* =========================
   LIGHT BUTTON
========================= */

.action-btn {

    margin-top: -5px;

    padding:
        16px 35px;

    border: none;

    border-radius: 50px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #c026d3
        );

    box-shadow:
        0 10px 35px
        rgba(236,72,153,.4);

    transition: .3s;

    opacity: 0;

    animation:
        fadeButton 1s ease 1.3s forwards;
}

.action-btn:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 15px 45px
        rgba(236,72,153,.65);
}

@keyframes fadeButton {

    to {
        opacity: 1;
    }
}


/* =========================
   BIRTHDAY MESSAGE
========================= */

.birthday-message {

    margin-top: 20px;

    font-size: 25px;

    font-weight: bold;

    color: #ffd1e3;

    opacity: 0;

    transform:
        translateY(20px)
        scale(.8);

    transition:
        1s ease;
}

.birthday-message.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    animation:
        birthdayGlow 2s infinite alternate;
}

@keyframes birthdayGlow {

    from {
        text-shadow:
            0 0 5px #ff6fa8;
    }

    to {
        text-shadow:
            0 0 25px #ff6fa8,
            0 0 45px #c026d3;
    }
}


/* =========================
   CONFETTI
========================= */

.confetti {

    position: fixed;

    top: -30px;

    z-index: 50;

    pointer-events: none;

    animation:
        confettiFall linear forwards;
}

@keyframes confettiFall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}


/* =========================
   NEXT BUTTON
========================= */

.next-btn {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    padding:
        14px 32px;

    border: 1px solid
        rgba(255,255,255,.25);

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #ff4f91,
            #c026d3
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    box-shadow:
        0 10px 35px
        rgba(255,79,145,.45);

    transition:
        opacity .7s ease,
        transform .3s ease;
}

.next-btn.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        translateY(0);
}

.next-btn:hover {

    transform:
        translateX(-50%)
        translateY(-4px)
        scale(1.05);

    box-shadow:
        0 15px 45px
        rgba(255,79,145,.65);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .scene {
        transform: scale(.85);
    }

    .cake-area {
        transform: scale(.85);
        margin-top: -10px;
        margin-bottom: -30px;
    }

    .subtitle {
        font-size: 16px;
    }

    .next-btn {
        bottom: 15px;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="glow one"></div>
<div class="glow two"></div>


<div class="scene">


    <!-- TITLE -->

    <div class="small-title">
        A LITTLE BIRTHDAY SURPRISE
    </div>


    <h1>
        Happy Birthday ❤️
    </h1>


    <div class="subtitle">
        Okay... now there's one thing left to do.
    </div>


    <!-- =========================
         CAKE
    ========================== -->

    <div class="cake-area">


        <!-- CANDLES -->

        <div class="candles">


            <div class="candle">

                <div class="wick"></div>

                <div class="flame"></div>

            </div>


            <div class="candle middle">

                <div class="wick"></div>

                <div class="flame"></div>

            </div>


            <div class="candle">

                <div class="wick"></div>

                <div class="flame"></div>

            </div>


        </div>


        <!-- TOP -->

        <div class="cake-top">

            <div class="frosting">

                <div class="drip one"></div>
                <div class="drip two"></div>
                <div class="drip three"></div>
                <div class="drip four"></div>

            </div>

        </div>


        <!-- MIDDLE -->

        <div class="cake-middle">

            <div class="frosting"></div>

        </div>


        <!-- BOTTOM -->

        <div class="cake-bottom">

            <div class="frosting"></div>

        </div>


        <!-- PLATE -->

        <div class="plate"></div>


    </div>


    <!-- =========================
         LIGHT CANDLES BUTTON
    ========================== -->

    <button
        class="action-btn"
        id="lightButton"
        onclick="lightCandles()">

        Chalo ab candles jalao 🕯️✨

    </button>


    <!-- =========================
         BIRTHDAY MESSAGE
    ========================== -->

    <div
        class="birthday-message"
        id="birthdayMessage">

        🎉 HAPPY BIRTHDAY, BEAUTIFUL! 🎂❤️

    </div>


</div>


<!-- =========================
     NEXT BUTTON
========================= -->

<button
    class="next-btn"
    id="nextButton"
    onclick="goNext()">

    One Last Thing... ❤️

</button>



<script>


/* =========================
   BIRTHDAY MELODY
========================= */

let audioContext;


function playBirthdayMelody() {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const notes = [

            392, 392, 440, 392,
            523, 494,

            392, 392, 440, 392,
            587, 523,

            392, 392, 784, 659,
            523, 494, 440,

            698, 698, 659,
            523, 587, 523

        ];


        const start =
            audioContext.currentTime;


        notes.forEach(
            (frequency, i) => {


                const oscillator =
                    audioContext.createOscillator();


                const gain =
                    audioContext.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.value =
                    frequency;


                const time =
                    start + i * .32;


                gain.gain.setValueAtTime(
                    0,
                    time
                );


                gain.gain.linearRampToValueAtTime(
                    .16,
                    time + .03
                );


                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    time + .28
                );


                oscillator.connect(gain);

                gain.connect(
                    audioContext.destination
                );


                oscillator.start(time);

                oscillator.stop(
                    time + .3
                );

            }
        );

    }

    catch(error) {

        console.log(
            "Audio error:",
            error
        );

    }

}


/* =========================
   LIGHT CANDLES
========================= */

function lightCandles() {


    /* LIGHT ALL FLAMES */

    const flames =
        document.querySelectorAll(
            ".flame"
        );


    flames.forEach(
        function(flame) {

            flame.classList.add(
                "lit"
            );

        }
    );


    /* CHANGE BUTTON */

    const button =
        document.getElementById(
            "lightButton"
        );


    button.innerHTML =
        "Yayyy! 🎉❤️";


    button.style.opacity =
        "0";


    button.style.pointerEvents =
        "none";


    /* MUSIC */

    playBirthdayMelody();


    /* BACKGROUND GLOW */

    document.body.style.background =
        "radial-gradient(circle at 50% 40%, #ff4f9160, transparent 35%), linear-gradient(135deg,#120014,#35003d,#09000d)";


    /* BIRTHDAY MESSAGE */

    setTimeout(
        function() {

            document
                .getElementById(
                    "birthdayMessage"
                )
                .classList.add(
                    "show"
                );

        },
        600
    );


    /* CONFETTI */

    createConfetti();


    /* SHOW NEXT BUTTON */

    setTimeout(
        function() {

            document
                .getElementById(
                    "nextButton"
                )
                .classList.add(
                    "show"
                );

        },
        2500
    );

}


/* =========================
   CONFETTI
========================= */

function createConfetti() {


    const symbols = [

        "❤️",
        "💕",
        "✨",
        "🎉",
        "💗",
        "⭐"

    ];


    for (
        let i = 0;
        i < 70;
        i++
    ) {


        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.innerHTML =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        confetti.style.left =
            Math.random() *
            100 +
            "vw";


        confetti.style.fontSize =
            (
                10 +
                Math.random() * 15
            ) +
            "px";


        confetti.style.animationDuration =
            (
                2 +
                Math.random() * 3
            ) +
            "s";


        confetti.style.animationDelay =
            Math.random() *
            1.5 +
            "s";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            function() {

                confetti.remove();

            },
            6000
        );

    }

}


/* =========================
   GO TO FINAL PAGE
========================= */

function goNext() {


    document.body.style.opacity =
        "0";


    document.body.style.transform =
        "scale(1.04)";


    document.body.style.transition =
        "1s ease";


    setTimeout(
        function() {

            window.location.href =
                "/final/";

        },
        900
    );

}

</script>


</body>

</html>
